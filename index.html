<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Showmax wishes You a Happy International Womens Day. Keep believing, you are incredible!">
	<title>Video Project</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
	<link rel="stylesheet" href="styles/styles.css?version=5">

	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>
	<header>
		<div class="container">
			<div class="row">
				<div class="col-sm-12 text-center">
					<img class="img-fluid logo-img" src="https://static.vecteezy.com/system/resources/previews/019/879/213/non_2x/video-camera-symbol-video-camera-icon-symbol-illustration-on-transparent-background-free-png.png" alt="Showmax Logo">
					<br>
					<br>
					<h1>Cool things about Zimbabwe</h1>
				</div>
			</div>
		</div>
	</header>
	
	<main class="container">
        <div class="row">
            <div class="col-sm-12 text-center">
				<!-- Video container with play button -->
				<div class="video-container">
					<video id="video1" class="img-fluid" controls>
						<source src="images/welcome-zimbabwe.mp4" type="video/mp4">
						Your browser does not support HTML video.
					</video>
					<h3>Welcome to Zimbabwe by Ruita</h3>
				</div>
				<div class="video-container">
					<video id="video2" class="img-fluid" controls>
						<source src="images/cuisine.mp4" type="video/mp4">
						Your browser does not support HTML video.
					</video>
					<h3>5 Fun Facts about Zimbabwe by Joshua</h3>
				</div>
				<div class="video-container">
					<video id="video2" class="img-fluid" controls>
						<source src="images/fun-facts-zim.mp4" type="video/mp4">
						Your browser does not support HTML video.
					</video>
					<h3>More Fun facts by Zuri</h3>
				</div>
				<div class="video-container">
					<video id="video3" class="img-fluid" controls>
						<source src="images/zimbabwe-cuisine.mp4" type="video/mp4">
						Your browser does not support HTML video.
					</video>
					<h3>Zimbabwean Cuisine by Liz</h3>
				</div>
				<div class="video-container">
					<video id="video4" class="img-fluid" controls>
						<source src="images/more-facts.mp4" type="video/mp4">
						Your browser does not support HTML video.
					</video>
					
					<h3>More Fun Facts about Zimbabwe by Amani.G</h3>
				</div>
			</div>
			
			
			
        </div>
    </main>

	!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
			<script>
				$(document).ready(function() {
					// Play video and hide play button
					$('.play-button').click(function() {
						const videoId = $(this).data('video');
						const video = document.getElementById(videoId);
						video.play();
						$(this).hide();  // Hide play button when video starts playing
				
						// Pause video and show play button when user clicks on the video
						$(video).click(function() {
							if (!video.paused) {
								video.pause();
								$(`[data-video='${videoId}']`).show();  // Show play button again
							}
						});
					});
				});
			</script>
	
</body>
</html>
